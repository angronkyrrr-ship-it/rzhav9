name: Build APK
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare project
        run: |
          mkdir -p www && cp index.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"com.example.rzhav9","appName":"RZHAV-9","webDir":"www"}' > capacitor.config.json
          npx cap add android
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build
        run: cd android && ./gradlew assembleDebug
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" android/app/build/outputs/apk/debug/app-debug.apk --title "RZHAV-9 beta ${{ github.run_number }}" --notes "Debug APK"
